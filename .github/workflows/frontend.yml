name: Frontend CI

on:
  workflow_call:

jobs:
  frontend:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app_admin/package-lock.json


      - name: Install Angular
        working-directory: app_admin
        run: npm ci


      - name: Build Angular
        working-directory: app_admin
        run: npm run build


      - name: Angular tests
        working-directory: app_admin
        run: npm test
