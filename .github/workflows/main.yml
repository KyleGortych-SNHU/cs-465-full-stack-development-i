name: Module 4 CI
on:
  workflow_dispatch:
    branches:
      - module4
    paths-ignore:
      - README.md

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Start server
        run: |
          npm start &
          npx wait-on http://localhost:3000/health --timeout 30000

      - name: Health endpoint
        run: curl --fail --silent http://localhost:3000/health

      - name: Home page responds
        run: curl --fail --silent http://localhost:3000/ > /dev/null

      - name: /travel renders Handlebars view with trips
        run: |
          body=$(curl --fail --silent http://localhost:3000/travel)
          echo "$body" | grep -qF "Gale Reef" || { echo "Trip data missing — hbs did not render"; exit 1; }
