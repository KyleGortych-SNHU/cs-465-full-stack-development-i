name: Backend CI

on:
  workflow_call:

jobs:
  backend:

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Wait for Mongo
        run: |
          for i in {1..30}; do
            (echo > /dev/tcp/127.0.0.1/27017) && break
            sleep 1
          done


      - name: Seed database
        run: npm run ci:seed


      - name: Unit tests
        run: npm run test:unit


      - name: Integration tests
        run: npm run test:integration


      - name: Start API
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000


      - name: Smoke test
        run: curl --fail http://127.0.0.1:3000/
