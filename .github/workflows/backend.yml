name: Backend CI

on:
  workflow_call:

jobs:
  backend:

    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/travlr_test
      JWT_SECRET: test-secret-not-for-production
      ADMIN_REGISTRATION_KEY: test-admin-key

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install dependencies
        run: npm ci

      - name: Seed database
        run: npm run ci:seed


      - name: Unit tests
        run: npm run test:unit


      - name: Integration tests
        run: npm run test:integration


      - name: Start API
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000


      - name: Smoke test
        run: |
          curl --fail http://127.0.0.1:3000/
          curl --fail http://127.0.0.1:3000/api/trips
